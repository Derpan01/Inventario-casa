<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>¿Qué quieres hacer?</h1>

    <nav class="caja">
        <ul class="linea">
            <li class="linea"><button onclick="window.location.href='inputs.html'">Ingresar productos</button></li>
            <br>
            <li class="linea"><button onclick="window.location.href='inventario.html'">Mostrar productos</button></li>
            <br>
            <li class="linea"><button onclick="window.location.href='eliminar.html'">Eliminar productos</button></li>
        </ul>
    </nav>

    <input type="file" id="fondoInput" accept="image/*" style="display: none;">
    <button class="fondo" onclick="document.getElementById('fondoInput').click()">Elegir y aplicar fondo</button>

    <script>
        const input = document.getElementById('fondoInput');

        input.addEventListener('change', () => {
            const archivo = input.files[0];
            if (archivo) {
            const lector = new FileReader();
            lector.onload = function(e) {
                document.body.style.backgroundImage = `url(${e.target.result})`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
            };
            lector.readAsDataURL(archivo);
        }
    });
    </script>

</body>
</html>
