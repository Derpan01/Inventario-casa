<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>homepage</title>
    <link rel="stylesheet" href="inputs.css">
</head>
<body>
    <script src="input.js" type="module"></script>

    <h1>Ingresa el producto</h1>

    <form id="formulario" onsubmit="agregarProducto(); return false;">
        <div style="display: flex; align-items: cente; gap: 8px;">
            <p>Producto:   </p>
            <input class="txt" type="text" id="producto" name="producto">
        </div>
    
        <br>
    
        <div style="display: flex; align-items: cente; gap: 8px;">
            <p>Cantidad:   </p>
            <input class="txt" type="number" id="cantidad" name="cantidad" min="1">
        </div>

        <br>
    
        <button class="submit" type="submit">Ingresar</button>
    </form>

    <button class="regresar" onclick="window.location.href='index.html'">Regresar</button>
    

</body>
</html>
